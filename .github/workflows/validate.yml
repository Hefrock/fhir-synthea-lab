name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Set up Java (for Synthea)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Start HAPI FHIR
        run: docker compose up -d

      - name: Wait for HAPI readiness
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' fhir-synthea-lab-hapi-1 2>/dev/null || echo "unknown")
            if curl -sf http://localhost:8080/fhir/metadata > /dev/null 2>&1; then
              echo "HAPI ready"
              exit 0
            fi
            echo "Waiting... ($i/60) [container health: $status]"
            sleep 10
          done
          echo "--- HAPI container logs ---"
          docker logs fhir-synthea-lab-hapi-1 --tail 100
          echo "HAPI did not start in time" && exit 1

      - name: Generate Synthea patients
        run: make generate

      - name: Load bundles
        run: make load

      - name: Verify fidelity and reproducibility
        run: make verify
        env:
          FHIR_BASE_URL: http://localhost:8080/fhir
