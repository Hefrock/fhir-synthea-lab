services:
  hapi:
    image: hapiproject/hapi:v7.2.0
    ports:
      - "8080:8080"
    volumes:
      - hapi-data:/data/hapi
    environment:
      hapi.fhir.default_encoding: json
      hapi.fhir.fhir_version: R4
      hapi.fhir.advanced_lucene_indexing: "false"
      spring.datasource.url: jdbc:h2:file:/data/hapi/h2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      spring.datasource.driverClassName: org.h2.Driver
      spring.datasource.username: sa
      spring.datasource.password: ""
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.H2Dialect
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/fhir/metadata"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

volumes:
  hapi-data:
